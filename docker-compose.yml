version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: minimarket_postgres
    environment:
      POSTGRES_DB: minimarket_pos
      POSTGRES_USER: minimarket
      POSTGRES_PASSWORD: minimarket_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - minimarket_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: minimarket_backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://minimarket:minimarket_secure_password@postgres:5432/minimarket_pos
      JWT_SECRET: your_jwt_secret_key_here
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
    networks:
      - minimarket_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: minimarket_frontend
    environment:
      REACT_APP_API_URL: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - minimarket_network

volumes:
  postgres_data:

networks:
  minimarket_network:
    driver: bridge
